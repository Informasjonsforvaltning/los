site_name: Los 4 – arbeidsside
site_description: Midlertidig arbeidsside og dokumentasjon for Los 4
site_url: https://informasjonsforvaltning.github.io/los/los4/
repo_url: https://github.com/Informasjonsforvaltning/los
repo_name: Informasjonsforvaltning/los
edit_uri: edit/master/docs/
copyright: Digitaliseringsdirektoratet – innholdet er tilgjengelig under CC BY 4.0

docs_dir: docs
site_dir: site
strict: true
use_directory_urls: true

nav:
  - Arbeidsside: index.md
  - Formål og bruksområder: formal-og-bruksomrader.md
  - Design- og modelleringsprinsipper: design-og-modelleringsprinsipper.md

theme:
  name: mkdocs
  locale: nb
  color_mode: auto
  user_color_mode_toggle: true
  navigation_depth: 3
  highlightjs: false

extra_css:
  - stylesheets/los.css

plugins:
  - search:
      lang:
        - "no"

markdown_extensions:
  - sane_lists
  - toc:
      permalink: true

name: Publish Los 4 documentation

on:
  pull_request:
    branches:
      - master
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - "requirements-docs.txt"
      - ".github/workflows/publish-docs.yml"
  push:
    branches:
      - master
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - "requirements-docs.txt"
      - ".github/workflows/publish-docs.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-los4-documentation
  cancel-in-progress: false

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out master content
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-docs.txt

      - name: Install documentation tools
        run: python -m pip install --requirement requirements-docs.txt

      - name: Build documentation
        run: python -m mkdocs build --strict

      - name: Check out GitHub Pages branch
        if: github.event_name != 'pull_request'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: gh-pages
          path: _gh_pages
          fetch-depth: 1

      - name: Publish only the Los 4 area
        if: github.event_name != 'pull_request'
        run: |
          rm -rf _gh_pages/los4
          mkdir -p _gh_pages/los4
          cp -R site/. _gh_pages/los4/
          touch _gh_pages/.nojekyll
          git -C _gh_pages config user.name "github-actions[bot]"
          git -C _gh_pages config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C _gh_pages add --all los4 .nojekyll
          if git -C _gh_pages diff --cached --quiet; then
            echo "No documentation changes to publish."
            exit 0
          fi
          git -C _gh_pages commit -m "docs: publish Los 4 documentation from ${GITHUB_SHA}"
          git -C _gh_pages push origin HEAD:gh-pages
